<!-- Main navbar start -->
<nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="home.html">
      <img src="https://cdn-icons-png.flaticon.com/512/3144/3144456.png" width="36" height="36" alt="Logo" class="me-2">

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link fs-5 fw-medium" href="home.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fs-5 fw-medium" href="products.html">Products</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fs-5 fw-medium" href="product-details.html">Product Details</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active fs-5 fw-medium" aria-current="page" href="signup.html">Signup</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fs-5 fw-medium" href="login.html">Login</a>
        </li>
      </ul>
      <!-- Cart start -->
      <button type="button" class="btn btn-outline-primary position-relative mx-auto my-2 my-lg-0">
        <i class="bi bi-cart-check-fill fs-5"></i> <span class="fs-5">Cart</span>
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
          2
          <span class="visually-hidden">unread messages</span>
        </span>
      </button>
      <form class="d-flex ms-lg-3" role="search">
        <input class="form-control me-2" type="search" placeholder="Search product..." aria-label="Search"/>
        <button class="btn btn-primary" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>

<!-- Breadcrumb start -->
<div class="container mt-4">
	<nav aria-label="breadcrumb">
	  <ol class="breadcrumb">
	    <li class="breadcrumb-item"><a href="home.html" class="text-decoration-none">Home</a></li>
	    <li class="breadcrumb-item active" aria-current="page">Signup</li>
	  </ol>
	</nav>
	<hr>
</div>

<!-- Signup form -->
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <form class="border p-4 rounded bg-white shadow-sm">
        <h3 class="text-center mb-4 fw-bold text-dark">Create New Account</h3>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-medium">First Name</label>
            <input class="form-control" type="text" placeholder="John">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-medium">Last Name</label>
            <input class="form-control" type="text" placeholder="Doe">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-medium">Mobile Number</label>
            <input class="form-control" type="tel" placeholder="+1234567890">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-medium">Email Address</label>
            <input class="form-control" type="email" placeholder="john@example.com">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-medium">Username</label>
            <input class="form-control" type="text" placeholder="johndoe">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-medium">Password</label>
            <input class="form-control" type="password" placeholder="Create a password">
          </div>
          <div class="col-md-12 mt-3 d-grid">
            <input class="btn btn-primary" type="submit" value="Register Account">
            <span class="mt-3 text-center">Already have an account? <a href="login.html" class="text-decoration-none">Login</a></span>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Footer start -->
<div class="footer-section mt-5 py-4">

		<div class="row align-items-center">

			</div>
			<div class="col-md-6 text-md-end">
				<h5 class="text-light m-0">Date: 2026</h5>
			</div>
		</div>
	</div>
</div>

<!-- Javascript link -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
